name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg binaries
        run: |
          mkdir bin
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "bin\ffmpeg.zip"
          Expand-Archive -Path "bin\ffmpeg.zip" -DestinationPath "bin\tmp"
          Move-Item "bin\tmp\ffmpeg-*\bin\*.exe" "bin\"
          Remove-Item "bin\tmp" -Recurse -Force
          Remove-Item "bin\ffmpeg.zip" -Force
        shell: powershell

      - name: Build standalone executable
        run: |
          python build_exe.py

      - name: Package Release ZIP
        run: |
          mkdir release
          Copy-Item "dist\untitled.arr.exe" "release\"
          Copy-Item "README.md" "release\"
          Compress-Archive -Path "release\*" -DestinationPath "untitled.arr-windows-x64.zip"
        shell: powershell

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: untitled.arr-windows-x64
          path: untitled.arr-windows-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: untitled.arr-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
